# Check if the binaries we have in this repository actually work when "npm i" is run
name: Install and test the binary

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node-version:
        - '24'
        - '26'
        container:
        - 'debian:trixie-slim'

    runs-on: ubuntu-latest

    container:
      image: ${{ matrix.container }}

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js ${{ matrix.node-version }}
      run: |
        apt-get update && apt-get install -y curl
        touch ~/.profile

        set -x
        curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.3/install.sh | bash
        ln -s ~/.nvm/nvm-exec /usr/bin/nvm

        nvm --version
        nvm install ${{ matrix.node-version }}
        nvm ls
        nvm use ${{ matrix.node-version }}

    - name: Print distro and Node.js version information
      run: cat /etc/os-release && node -v && npm -v

    - name: Install the package
      run: npm install

    - name: Run the tests
      run: npm test
