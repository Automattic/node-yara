# Check if the binaries we have in this repository actually work when "npm i" is run
name: Install and test the binary

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Node.js 24 binaries must keep loading on bookworm (Debian 12); Node.js 26 only supports trixie
        include:
        - node-version: '24'
          container: 'debian:bookworm-slim'
        - node-version: '24'
          container: 'debian:trixie-slim'
        - node-version: '26'
          container: 'debian:trixie-slim'

    runs-on: ubuntu-latest

    container:
      image: ${{ matrix.container }}

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js ${{ matrix.node-version }}
      run: |
        echo "I am $(whoami)."
        apt-get update && apt-get install -y curl

        # https://github.com/nodesource/distributions/blob/master/DEV_README.md#debian-versions
        set -x
        curl -fsSL https://deb.nodesource.com/setup_${{ matrix.node-version }}.x -o nodesource_setup.sh
        bash nodesource_setup.sh
        apt install -y nodejs
        which node
        node -v

    - name: Print distro and Node.js version information
      run: cat /etc/os-release && node -v && npm -v

    - name: Install the package
      run: npm install

    # npm install downloads the binary from master, so on a pull request it would test the old binary
    # rather than the one being changed; test the binary committed in this checkout instead
    - name: Use the binary from this checkout
      run: |
        set -x
        BINARY=binaries/yara-v$(node -p 'require("./package.json").version')-linux-x64-node-v$(node -p 'process.versions.modules').tar.gz
        ls -lh "$BINARY"
        rm -rf build/Release && mkdir -p build
        tar -xzf "$BINARY" -C build

    - name: Run the tests
      run: npm test
